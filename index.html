<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الحروف الإنجليزية والعلكة</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* لوحة المعلومات والنقاط */
        .header {
            margin-top: 15px;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        /* منطقة عرض الحيوان والسؤال */
        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }

        .animal-card {
            background: white;
            padding: 20px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            margin-bottom: 20px;
            animation: bounceIn 0.5s ease;
        }

        .animal-emoji {
            font-size: 80px;
            margin-bottom: 10px;
        }

        .animal-name {
            font-size: 28px;
            color: #333;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* الكرة التي يسحبها الطفل */
        .ball {
            width: 50px;
            height: 50px;
            background: radial-gradient(circle at 30% 30%, #ff5252, #b71c1c);
            border-radius: 50%;
            cursor: grab;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            position: absolute;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
            transition: transform 0.1s;
        }
        .ball:active {
            cursor: grabbing;
            transform: scale(1.1);
        }

        /* شريط الحروف (العلكة) في سطر واحد */
        .gum-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(5px);
            padding: 20px 10px;
            display: flex;
            overflow-x: auto;
            gap: 10px;
            justify-content: flex-start;
            align-items: center;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
            white-space: nowrap;
        }

        /* شكل العلكة لكل حرف */
        .gum-item {
            min-width: 55px;
            height: 55px;
            background: radial-gradient(circle at 30% 30%, #ff80ab, #c51162);
            border-radius: 50% 50% 45% 45%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            box-shadow: inset -4px -4px 10px rgba(0,0,0,0.3), 0 4px 8px rgba(0,0,0,0.2);
            position: relative;
            flex-shrink: 0;
            transition: transform 0.2s, background 0.2s;
        }

        .gum-item::after {
            content: '';
            position: absolute;
            bottom: -5px;
            width: 10px;
            height: 8px;
            background: #c51162;
            border-radius: 0 0 5px 5px;
        }

        .gum-item.highlight {
            animation: pulseGum 0.5s infinite alternate;
        }

        @keyframes pulseGum {
            from { transform: scale(1); }
            to { transform: scale(1.15); background: radial-gradient(circle at 30% 30%, #ff4081, #ad1457); }
        }

        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }

        /* رسالة التوجيه والفوز */
        .message {
            position: absolute;
            top: 20%;
            font-size: 22px;
            color: #fff;
            background: rgba(0,0,0,0.4);
            padding: 10px 20px;
            border-radius: 30px;
            pointer-events: none;
            text-align: center;
        }

        /* كانفاس الألعاب النارية */
        #fireworks-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>

    <canvas id="fireworks-canvas"></canvas>

    <div class="header">⭐ النقاط: <span id="score">0</span></div>

    <div class="message" id="instruction">اسحب الكرة وضعها على الحرف المنازل لاسم الحيوان!</div>

    <div class="game-area">
        <div class="animal-card" id="animalCard">
            <div class="animal-emoji" id="animalEmoji">🐶</div>
            <div class="animal-name" id="animalName">Dog</div>
        </div>
    </div>

    <!-- الكرة القابلة للسحب -->
    <div class="ball" id="draggableBall" style="left: 50%; top: 50%;">⚽</div>

    <!-- شريط العلكة (الحروف) -->
    <div class="gum-container" id="gumContainer">
        <!-- سيتم تعبئة الحروف تلقائياً عبر JavaScript -->
    </div>

    <script>
        // قائمة الحيوانات مع الحرف الأول
        const animals = [
            { name: "Ant", emoji: "🐜", letter: "A" },
            { name: "Bear", emoji: "🐻", letter: "B" },
            { name: "Cat", emoji: "🐱", letter: "C" },
            { name: "Dog", emoji: "🐶", letter: "D" },
            { name: "Elephant", emoji: "🐘", letter: "E" },
            { name: "Fish", emoji: "🐠", letter: "F" },
            { name: "Giraffe", emoji: "🦒", letter: "G" },
            { name: "Horse", emoji: "🐴", letter: "H" },
            { name: "Iguana", emoji: "🦎", letter: "I" },
            { name: "Jellyfish", emoji: "🪼", letter: "J" },
            { name: "Kangaroo", emoji: "🦘", letter: "K" },
            { name: "Lion", emoji: "🦁", letter: "L" },
            { name: "Monkey", emoji: "🐵", letter: "M" },
            { name: "Nest", emoji: "🐦", letter: "N" }, // بديل لسهولة الرمز
            { name: "Owl", emoji: "🦉", letter: "O" },
            { name: "Penguin", emoji: "🐧", letter: "P" },
            { name: "Queen", emoji: "👸", letter: "Q" },
            { name: "Rabbit", emoji: "🐰", letter: "R" },
            { name: "Snake", emoji: "🐍", letter: "S" },
            { name: "Tiger", emoji: "🐯", letter: "T" },
            { name: "Umbrella", emoji: "☂️", letter: "U" },
            { name: "Vulture", emoji: "🦅", letter: "V" },
            { name: "Whale", emoji: "🐳", letter: "W" },
            { name: "X-ray", emoji: "🦴", letter: "X" },
            { name: "Yak", emoji: "🐂", letter: "Y" },
            { name: "Zebra", emoji: "🦓", letter: "Z" }
        ];

        let score = 0;
        let currentAnimal = {};
        
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
        const gumContainer = document.getElementById("gumContainer");
        const ball = document.getElementById("draggableBall");
        const animalEmoji = document.getElementById("animalEmoji");
        const animalName = document.getElementById("animalName");
        const scoreDisplay = document.getElementById("score");

        let initialBallPos = { x: window.innerWidth / 2 - 25, y: window.innerHeight / 2 };

        // بناء شريط الحروف (العلكة)
        alphabet.forEach(letter => {
            const gum = document.createElement("div");
            gum.className = "gum-item";
            gum.innerText = letter;
            gum.dataset.letter = letter;
            gumContainer.appendChild(gum);
        });

        function nextRound() {
            // اختيار حيوان عشوائي
            currentAnimal = animals[Math.floor(Math.random() * animals.length)];
            animalEmoji.innerText = currentAnimal.emoji;
            animalName.innerText = currentAnimal.name;
            resetBallPosition();
        }

        function resetBallPosition() {
            ball.style.left = `${window.innerWidth / 2 - 25}px`;
            ball.style.top = `${window.innerHeight * 0.55}px`;
        }

        // آلية السحب والإفلات (Drag & Drop / Touch Support)
        let isDragging = false;
        let startX, startY;

        ball.addEventListener("mousedown", startDrag);
        ball.addEventListener("touchstart", startDrag, { passive: false });

        document.addEventListener("mousemove", drag);
        document.addEventListener("touchmove", drag, { passive: false });

        document.addEventListener("mouseup", endDrag);
        document.addEventListener("touchend", endDrag);

        function startDrag(e) {
            isDragging = true;
            let clientX = e.clientX || e.touches[0].clientX;
            let clientY = e.clientY || e.touches[0].clientY;
            startX = clientX - ball.offsetLeft;
            startY = clientY - ball.offsetTop;
            e.preventDefault();
        }

        function drag(e) {
            if (!isDragging) return;
            let clientX = e.clientX || e.touches[0].clientX;
            let clientY = e.clientY || e.touches[0].clientY;
            
            ball.style.left = `${clientX - startX}px`;
            ball.style.top = `${clientY - startY}px`;
            e.preventDefault();
        }

        function endDrag(e) {
            if (!isDragging) return;
            isDragging = false;

            // التحقق من الحرف المستهدف تحت الكرة
            let ballRect = ball.getBoundingClientRect();
            let ballCenterX = ballRect.left + ballRect.width / 2;
            let ballCenterY = ballRect.top + ballRect.height / 2;

            let targetGum = null;
            document.querySelectorAll(".gum-item").forEach(gum => {
                let rect = gum.getBoundingClientRect();
                if (
                    ballCenterX >= rect.left && ballCenterX <= rect.right &&
                    ballCenterY >= rect.top && ballCenterY <= rect.bottom
                ) {
                    targetGum = gum;
                }
            });

            if (targetGum) {
                let selectedLetter = targetGum.dataset.letter;
                if (selectedLetter === currentAnimal.letter) {
                    // إجابة صحيحة!
                    score += 10;
                    scoreDisplay.innerText = score;
                    triggerFireworks(targetGum);
                    setTimeout(() => {
                        nextRound();
                    }, 1500);
                } else {
                    // إجابة خاطئة
                    resetBallPosition();
                }
            } else {
                resetBallPosition();
            }
        }

        // محاكاة الألعاب النارية البسيطة خارج الحرف الصحيح
        const canvas = document.getElementById("fireworks-canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];

        function triggerFireworks(element) {
            let rect = element.getBoundingClientRect();
            let x = rect.left + rect.width / 2;
            let y = rect.top;

            for (let i = 0; i < 50; i++) {
                particles.push({
                    x: x,
                    y: y,
                    angle: Math.random() * Math.PI * 2,
                    speed: Math.random() * 6 + 2,
                    radius: Math.random() * 4 + 2,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    life: 60
                });
            }
        }

        function animateFireworks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += Math.cos(p.angle) * p.speed;
                p.y += Math.sin(p.angle) * p.speed;
                p.life--;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                if (p.life <= 0) {
                    particles.splice(index, 1);
                }
            });
            requestAnimationFrame(animateFireworks);
        }

        animateFireworks();
        window.addEventListener("resize", () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // بدء اللعبة لأول مرة
        nextRound();
    </script>
</body>
</html>
